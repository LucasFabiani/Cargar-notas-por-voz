<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Notas por voz</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #f4f6f8;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #1f2937;
}

.contenedor {

    width: min(900px, 94%);

    margin: 30px auto 80px;
}

h1 {

    text-align: center;

    margin-bottom: 5px;
}

.subtitulo {

    text-align: center;

    color: #6b7280;

    margin-bottom: 25px;
}


/* ============================= */
/* PANEL */
/* ============================= */

.panel {

    background: white;

    border-radius: 18px;

    padding: 20px;

    margin-bottom: 18px;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,.07);
}


/* ============================= */
/* BOTONES */
/* ============================= */

button {

    border: 0;

    cursor: pointer;

    font-size: 16px;

    transition: .2s;
}

button:hover {

    transform: translateY(-1px);
}

.botonSecundario {

    width: 100%;

    padding: 14px;

    border-radius: 10px;

    background: #e5e7eb;

    color: #111827;

    font-weight: bold;
}

#microfono {

    display: block;

    width: 120px;

    height: 120px;

    margin: 25px auto;

    border-radius: 50%;

    background: #2563eb;

    color: white;

    font-size: 44px;

    box-shadow:
        0 8px 25px
        rgba(37,99,235,.3);
}

#microfono:hover {

    transform: scale(1.05);
}

#microfono:disabled {

    background: #9ca3af;

    cursor: not-allowed;

    box-shadow: none;

    transform: none;
}

#microfono.activo {

    background: #dc2626;

    animation:
        pulso
        1.4s
        infinite;
}

@keyframes pulso {

    0% {

        box-shadow:
            0 0 0 0
            rgba(220,38,38,.45);
    }

    70% {

        box-shadow:
            0 0 0 30px
            rgba(220,38,38,0);
    }

    100% {

        box-shadow:
            0 0 0 0
            rgba(220,38,38,0);
    }
}


/* ============================= */
/* ESTADO */
/* ============================= */

#estadoModelo {

    text-align: center;

    font-size: 14px;

    color: #6b7280;

    margin-top: 10px;
}


/* ============================= */
/* RESULTADO */
/* ============================= */

.resultado {

    text-align: center;

    min-height: 145px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    transition: .2s;
}

.resultado .titulo {

    font-size: 14px;

    text-transform: uppercase;

    color: #6b7280;

    font-weight: bold;

    letter-spacing: 1px;
}

#dictado {

    font-size: 24px;

    font-weight: bold;

    margin-top: 10px;

    min-height: 30px;
}

#resultadoFinal {

    margin-top: 12px;

    font-size: 21px;

    font-weight: bold;
}

.resultado.ok {

    background: #ecfdf5;

    border: 2px solid #86efac;
}

.resultado.error {

    background: #fff7ed;

    border: 2px solid #fdba74;
}


/* ============================= */
/* CONTADOR */
/* ============================= */

#contador {

    text-align: center;

    margin: 15px 0;

    font-weight: bold;

    color: #4b5563;
}


/* ============================= */
/* TABLA */
/* ============================= */

.tablaContenedor {

    overflow-x: auto;
}

table {

    width: 100%;

    border-collapse: collapse;

    background: white;
}

th,
td {

    padding: 11px 10px;

    border-bottom:
        1px solid #e5e7eb;

    text-align: left;
}

th {

    background: #f3f4f6;

    font-size: 14px;

    color: #4b5563;
}

tr.asignado {

    background: #f0fdf4;
}

tr.desaprobado {

    background: #fef2f2;
}

td.nota {

    width: 100px;

    font-weight: bold;
}

.inputNota {

    width: 65px;

    padding: 6px;

    font-size: 16px;

    text-align: center;

    border:
        1px solid #d1d5db;

    border-radius: 6px;
}


/* ============================= */
/* VACÍO */
/* ============================= */

#sinAlumnos {

    text-align: center;

    color: #9ca3af;

    padding: 30px;
}


/* ============================= */
/* MOBILE */
/* ============================= */

@media(max-width:600px) {

    .contenedor {

        width: 96%;

        margin-top: 15px;
    }

    h1 {

        font-size: 25px;
    }

    #microfono {

        width: 105px;

        height: 105px;

        font-size: 38px;
    }

    #dictado {

        font-size: 21px;
    }

}
/* =========================================
   MICROFONO REACTIVO AL VOLUMEN
========================================= */

#microfono {
    --nivel: 0;

    transform:
        scale(
            calc(1 + var(--nivel) * .22)
        );

    box-shadow:
        0 0
        calc(20px + var(--nivel) * 35px)
        calc(var(--nivel) * 10px)
        rgba(220,38,38,.28);
}

#microfono.activo {
    animation: none;
}

/* aro exterior */

#microfono.activo::before {
    content: "";

    position: absolute;

    inset: -10px;

    border-radius: 50%;

    border: 3px solid
        rgba(220,38,38,.25);

    transform:
        scale(
            calc(1 + var(--nivel) * .30)
        );

    opacity:
        calc(.3 + var(--nivel));
}

#microfono {
    position: relative;
}


/* =========================================
   MINI ESTADO FLOTANTE
========================================= */

#miniEstado {

    display: none;

    position: fixed;

    left: 12px;
    right: 12px;
    bottom: 12px;

    z-index: 1000;

    background:
        rgba(17,24,39,.94);

    backdrop-filter:
        blur(12px);

    color: white;

    border-radius: 16px;

    padding: 10px 14px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.25);

    align-items: center;

    gap: 12px;
}

#miniMicrofono {

    display: flex;

    align-items: center;

    gap: 6px;

    flex-shrink: 0;

    font-size: 12px;

    font-weight: bold;

    color: #fca5a5;
}

.miniPunto {

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #ef4444;

    box-shadow:
        0 0 0
        rgba(239,68,68,.5);

    animation:
        miniPulso
        1.4s
        infinite;
}

@keyframes miniPulso {

    0% {
        box-shadow:
            0 0 0 0
            rgba(239,68,68,.5);
    }

    70% {
        box-shadow:
            0 0 0 8px
            rgba(239,68,68,0);
    }

    100% {
        box-shadow:
            0 0 0 0
            rgba(239,68,68,0);
    }
}

#miniTexto {

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 14px;

    flex: 1;
}


/* Solo usamos el mini panel en pantallas chicas */

@media(max-width: 700px) {

    #miniEstado.visible {

        display: flex;
    }

}
</style>

</head>

<!-- MINI ESTADO FLOTANTE PARA CELULAR -->
<div id="miniEstado">
    <div id="miniMicrofono">
        <span class="miniPunto"></span>
        <span>Grabando</span>
    </div>

    <div id="miniTexto">
        Escuchando...
    </div>
</div>
<body>

<div class="contenedor">

    <h1>
        🎤 Notas por voz
    </h1>

    <div class="subtitulo">
        Decí el apellido o nombre del alumno y su nota.
    </div>


    <!-- ========================= -->
    <!-- CARGAR ALUMNOS -->
    <!-- ========================= -->

    <div class="panel">

        <button
            id="cargarAlumnos"
            class="botonSecundario"
        >
            📋 Cargar alumnos desde portapapeles
        </button>

        <div id="estadoModelo">
            ⏳ Cargando modelo de voz...
        </div>

    </div>


    <!-- ========================= -->
    <!-- RESULTADO -->
    <!-- ========================= -->

    <div
        id="panelResultado"
        class="panel resultado"
    >

        <div class="titulo">
            Dictado
        </div>

        <div id="dictado">
            Esperando...
        </div>

        <div id="resultadoFinal"></div>

    </div>


    <!-- ========================= -->
    <!-- MICROFONO -->
    <!-- ========================= -->

    <button
        id="microfono"
        disabled
    >
        🎤
    </button>


    <div id="contador">
        0 alumnos · 0 notas cargadas
    </div>


    <!-- ========================= -->
    <!-- COPIAR -->
    <!-- ========================= -->

    <div class="panel">

        <button
            id="copiarNotas"
            class="botonSecundario"
        >
            📋 Copiar notas
        </button>

    </div>


    <!-- ========================= -->
    <!-- TABLA -->
    <!-- ========================= -->

    <div class="panel tablaContenedor">

        <div id="sinAlumnos">

            Cargá primero los alumnos
            desde el portapapeles.

        </div>

        <table
            id="tabla"
            style="display:none"
        >

            <thead>

                <tr>

                    <th>
                        Apellido
                    </th>

                    <th>
                        Nombre
                    </th>

                    <th>
                        Nota
                    </th>

                </tr>

            </thead>

            <tbody></tbody>

        </table>

    </div>

</div>


<script
    type="module"
    src="/main.js"
></script>

</body>

</html>
